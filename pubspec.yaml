name: kbju_tracker
description: Трекер калорий и КБЖУ с распознаванием еды по фото + плагины Winter (шахматы, сапёр, музыка и др.).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  winter_core:
    git:
      url: https://github.com/Wateroflord/winter-hub.git
      path: packages/winter_core
      ref: 2c2002e2c47b0ae344152f53c0a5b309043c9e9d
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.3
  flutter_local_notifications: ^17.2.4
  google_fonts: ^6.2.1
  health: '>=11.0.0 <14.0.0'
  http: ^1.2.2
  crypto: ^3.0.6
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  share_plus: '>=11.0.0 <14.0.0'
  permission_handler: '>=11.3.0 <13.0.0'
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  # ---- плагины ----
  # Шахматы
  chess: ^0.8.1
  flutter_svg: ^2.0.10
  # Winter Music
  audioplayers: ^6.1.0
  audio_service: ^0.18.15
  # Winter Paint, Mog Battle, Music
  file_picker: ^10.3.0
  image: ^4.2.0
  # Winter Walks
  flutter_map: '>=7.0.2 <9.0.0'
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  xml: ^6.5.0
  # Выживание в лесу
  flutter_compass: ^0.8.1
  torch_light: ^1.1.0
  # Просрочка
  shared_preferences: ^2.3.0
  # Push-Up Arena (камера + распознавание позы, экран не гаснет во время подхода)
  camera: '>=0.11.0 <1.0.0'
  google_mlkit_pose_detection: '>=0.12.0 <1.0.0'
  wakelock_plus: '>=1.2.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/plugins/chess/
    - assets/plugins/chess/pieces/
    - assets/plugins/draw/
    - assets/plugins/expiry/
    - assets/plugins/forest/
    - assets/plugins/language/
    - assets/plugins/mines/
    - assets/plugins/mog/
    - assets/plugins/music/
    - assets/plugins/paint/
    - assets/plugins/pushups/
    - assets/plugins/walks/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
