name: kbju_tracker
description: Трекер калорий и КБЖУ с распознаванием еды по фото.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.2.4
  google_fonts: ^6.2.1
  health: '>=11.0.0 <14.0.0'
  http: ^1.2.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.4
  permission_handler: '>=11.3.0 <13.0.0'
  timezone: ^0.9.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
