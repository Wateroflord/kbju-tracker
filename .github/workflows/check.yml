name: Check (branches)

# Быстрая проверка кода на рабочих ветках: без сборки APK и без выпуска релиза.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare
        run: |
          flutter create --project-name kbju_tracker --org com.kbju --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py > /dev/null
          flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && ok=1 || ok=0
          cat analyze.txt
          python3 .winter/ci/annotate.py analyze.txt "analyze"
          [ "$ok" = 1 ]
      - name: Unit tests
        run: flutter test
      - name: Build APK (not published)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt || { python3 .winter/ci/annotate.py build.txt "build"; exit 1; }
