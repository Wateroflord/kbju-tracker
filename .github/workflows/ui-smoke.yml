name: UI smoke (emulator)

# Ставит x86_64-версию из готовой сборки на эмулятор и проверяет шторку и плагины.
# Скриншоты — в ветке ui-smoke-out (папка out/).
# Запуск: пуш в ветку ui-smoke-run, в tools/smoke/run_id.txt — номер запуска «Build APK»
# (собранного с выключенным publish — тогда файлы лежат в артефактах).
on:
  push:
    branches: [ui-smoke-run]

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "id=$(cat tools/smoke/run_id.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: android-test
          path: apks
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke/run.sh apks/KBJU-Tracker-x86_64.apk
      - name: Save screenshots
        if: always()
        run: |
          git config user.name "kbju-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ui-smoke-out
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m "ui smoke ${{ steps.rid.outputs.id }}" > /dev/null
          git push -f origin ui-smoke-out
