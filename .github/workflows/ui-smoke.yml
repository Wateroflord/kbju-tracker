name: UI smoke (emulator)

# Ставит x86_64-версию из готовой сборки на эмулятор и проверяет шторку и плагины.
# Скриншоты — в ветке ui-smoke-out (папка out/).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Номер запуска «Build APK» (с publish выключенным — файлы в артефактах)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test
          path: apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke/run.sh apks/KBJU-Tracker-x86_64.apk
      - name: Save screenshots
        if: always()
        run: |
          git config user.name "kbju-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ui-smoke-out
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m "ui smoke ${{ inputs.run_id }}" > /dev/null
          git push -f origin ui-smoke-out
