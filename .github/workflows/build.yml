# Сборка — общая для всех приложений Winter: winter-hub/.github/workflows/flutter-app.yml
# (отдельный APK под каждый процессор, подпись, релиз, Windows-установщик).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Выпустить релиз (выключи, чтобы только проверить сборку)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  app:
    uses: Wateroflord/winter-hub/.github/workflows/flutter-app.yml@abi-split
    secrets: inherit
    with:
      project: kbju_tracker
      org: com.kbju
      asset: KBJU-Tracker
      title: КБЖУ Трекер
      win_title: KBJU Tracker
      # Плагин «Шахматы»: движок Stockfish (на телефоне — только в версии arm64).
      prepare: bash tools/stockfish.sh fetch
      after_build_windows: bash tools/stockfish.sh install
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      hub_ref: abi-split  # TEMP: test
