name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --project-name kbju_tracker --org com.kbju --platforms android .
          rm -rf test

      - name: Configure Android manifest
        run: python3 tools/patch_android.py

      - name: Install signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: App icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBJU-Tracker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
